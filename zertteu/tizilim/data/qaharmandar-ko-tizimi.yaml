# Кеңес Одағының Батыры — ТОЛЫҚ ТІЗІМ (шикі қабат)
#
# НЕГЕ БӨЛЕК ФАЙЛ. Бұл тізім `qaharmandar.yaml`-ға ҚОСЫЛМАЙДЫ, себебі
# тасымалы әлсіз: ол ru.wikipedia-дің «Список Героев Советского Союза
# (Казахстан)» бетінің dic.academic.ru айнасынан алынды, ал айна — ЕСКІ
# нұсқаның көшірмесі. ӘДІСТЕМЕ бойынша бұл V деңгей, екі қайтара
# қашықтаған. Сондықтан бүкіл файл — деңгейі C.
#
# Егер бұл 356 жазба сұрыпталған тізілімге құйылса, ол тізілімдегі барлық
# басқа қабаттан көп болып, А мен B деңгейіндегі жұмысты басып қалар еді.
# Тізілімнің мәні — сан емес, дәлел деңгейі.
#
# ТІЗІМНІҢ ШЕҢБЕРІ ДӘЛ ЕМЕС. Бастапқы бет «тағдыры бір кезеңде
# республикамен байланысты болған» иегерлерді қамтиды, яғни:
#   - ұлты қазақ емес адамдар да кіреді;
#   - соғыстан кейінгі иегерлер де кіреді (мысалы ғарышкер В. Жәнібеков);
#   - әр жазбаның ұлты да, атақ берілген күні де АНЫҚТАЛМАДЫ.
#
# ЕСІМДЕР ОРЫС ЖАЗУЫНДА қалдырылды. Қазақша нұсқасын ойдан жазу —
# дерек жасау болар еді, сондықтан `name_kk` бос. Оны толтыру жеке жұмыс.
#
# КӨТЕРУ ЖОЛЫ: әр жазбаны «Герои Советского Союза. Краткий биографический
# словарь» (М., 1987–1988) немесе ҚР архивінен тексеру. Тексерілген жазба
# `qaharmandar.yaml`-ға XX қабатына көшеді.
#
# Алынған күні: 2026-11-03.

