    «Оларға Совет өкіметі «Батыр» атағын бермеген» деген тұжырымымен
    үйлеседі. Сондықтан kz.kursiv.media мақаласының оны Кеңес Одағының
    Батырларының қатарында атауы — шатастыру.
  refuted:
    - claim: 'Рақымжан Қошқарбаев — Кеңес Одағының Батыры'
